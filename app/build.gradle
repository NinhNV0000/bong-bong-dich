plugins {
    id "com.android.application"
}

android {
    namespace "com.ninh.bongbongdich"
    compileSdk 35

    def stableSigningFilePath = System.getenv("BBD_SIGNING_STORE_FILE")

    defaultConfig {
        applicationId "com.ninh.bongbongdich"
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName "1.9.2"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        stableRelease {
            if (stableSigningFilePath) {
                storeFile file(stableSigningFilePath)
                storePassword System.getenv("BBD_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("BBD_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("BBD_SIGNING_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (stableSigningFilePath) {
                signingConfig signingConfigs.stableRelease
            } else if (System.getenv("CI") == "true") {
                throw new GradleException(
                        "Thiếu khóa ký ổn định: từ chối tạo APK release trong CI"
                )
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.15.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}
