name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cài Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK release ARM64
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk BongBongDich-v1.9.0-arm64.apk

      - name: Lưu APK trong Actions
        uses: actions/upload-artifact@v4
        with:
          name: BongBongDich-v1.9.0-arm64
          path: BongBongDich-v1.9.0-arm64.apk
          if-no-files-found: error
          retention-days: 90

      - name: Tạo bản phát hành v1.9.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: Bong Bóng Dịch v1.9.0
          body: |
            Nâng độ chính xác bằng chế độ dịch lai theo ngữ cảnh.

            Câu dài, hội thoại và mô tả được dịch riêng nguyên đoạn; nút và nhãn ngắn vẫn gom lô để giữ tốc độ.
            OCR dùng ảnh nét hơn và hỗ trợ nhiều vùng chữ hơn trên cùng màn hình.
            Bổ sung từ điển tự động cho game, Naruto và thuật ngữ sản xuất/chất lượng.
            Từ điển người dùng tự dạy vẫn có mức ưu tiên cao nhất.
          files: BongBongDich-v1.9.0-arm64.apk
          make_latest: true
          overwrite_files: true
