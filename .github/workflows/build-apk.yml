name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK release ARM64
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk BongBongDich-v1.2.0-arm64.apk

      - name: Lưu APK trong Actions
        uses: actions/upload-artifact@v4
        with:
          name: BongBongDich-v1.2.0-arm64
          path: BongBongDich-v1.2.0-arm64.apk
          if-no-files-found: error
          retention-days: 90

      - name: Tạo bản phát hành v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Bong Bóng Dịch v1.2.0
          body: |
            Sửa vị trí lớp dịch trên màn hình ngang và ngăn các ô dịch chồng chéo.
            
            Ô tiếng Việt được giới hạn theo đúng vùng chữ gốc và tự co cỡ chữ để không tràn.
            Chạm 译 để dịch; bong bóng đổi thành ×, chạm lần nữa để tắt toàn bộ bản dịch.
          files: BongBongDich-v1.2.0-arm64.apk
          make_latest: true
          overwrite_files: true
