name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cài Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK release ARM64
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Kiểm tra chữ ký APK
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | tee signing-report.txt

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk BongBongDich-v1.10.4-arm64.apk

      - name: Lưu APK trong Actions
        uses: actions/upload-artifact@v4
        with:
          name: BongBongDich-v1.10.4-arm64
          path: |
            BongBongDich-v1.10.4-arm64.apk
            signing-report.txt
          if-no-files-found: error
          retention-days: 90

      - name: Tạo bản phát hành v1.10.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.4
          name: Bong Bóng Dịch v1.10.4
          body: |
            Bản khôi phục độ mượt của các phiên bản đầu.

            - Khôi phục bộ dịch ML Kit Trung–Việt chạy trực tiếp trên điện thoại như v1.0–v1.3.
            - Sau khi model được tải một lần, các lần dịch sau không phải chờ phản hồi Google.
            - Hiển thị từng vùng ngay khi dịch xong để tạo cảm giác liền mạch.
            - Nếu model chưa tải được, ứng dụng tự dùng chế độ Google theo lô của v1.10.3.
            - Giữ nguyên từ điển người dùng, giao diện ảnh dịch, xử lý xuống dòng và một bong bóng ×.

            Bản này ưu tiên tốc độ và độ mượt; câu dịch có thể thô hơn chế độ Google.

            Bản này vẫn dùng chữ ký build tạm như các bản trước. Khi phải gỡ/cài lại,
            hãy chọn thư mục từ điển cũ để khôi phục các thuật ngữ đã dạy.
          files: BongBongDich-v1.10.4-arm64.apk
          make_latest: true
          overwrite_files: true
